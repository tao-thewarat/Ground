services:
    odoo:
        container_name: odoo
        build: .
        depends_on:
            - db
        ports:
            - "8069:8069" # web
            - "3000:3000"
        volumes:
            - odoo-data:/var/lib/odoo
            - odoo-addons:/mnt/extra-addons
            - ./addons:/mnt/addons
            - ./additional-addons:/mnt/additional-addons
            - ./odoo.conf:/etc/odoo/odoo.conf
        logging:
            options:
                max-size: 10m
        command: >
          sh -c "pip3 install debugpy --break-system-packages &&
          python3 -m debugpy --listen 0.0.0.0:3000
          /usr/bin/odoo -c /etc/odoo/odoo.conf
          --dev=qweb,xml ${OPTIONS:-}"
        stdin_open: true
        tty: true

    db:
        image: postgres:17
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_USER=odoo
            - POSTGRES_PASSWORD=odoo
            - POSTGRES_DB=postgres
        volumes:
            - db-data:/var/lib/postgresql/data
        logging:
            options:
                max-size: 10m

volumes:
    odoo-data:
    odoo-addons:
    db-data:
